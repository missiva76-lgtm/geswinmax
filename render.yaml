services:
  - type: web
    name: geswinmax-backend
    runtime: node
    region: frankfurt
    branch: main
    rootDir: backend
    # Os browsers do Playwright são instalados no BUILD (o postinstall do
    # package.json faz `playwright install chromium`) e ficam dentro de
    # node_modules por causa de PLAYWRIGHT_BROWSERS_PATH=0 — ver nota abaixo.
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      # PLAYWRIGHT_BROWSERS_PATH=0 instala os browsers em
      # node_modules/playwright-core/.local-browsers, dentro da pasta do
      # projeto — a única que o Render transporta do build para a execução.
      # Com o valor anterior (/opt/render/.cache/ms-playwright) os ficheiros
      # ficavam fora dessa pasta, pelo que o comando de arranque tinha de os
      # descarregar outra vez: 293 MB e mais de um minuto em CADA arranque,
      # incluindo cada vez que a instância acordava.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
    healthCheckPath: /health
